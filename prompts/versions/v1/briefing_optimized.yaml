name: briefing_generation_optimized
version: "1.1.0"
description: "Generate daily briefing with Lost-in-the-Middle context optimization"
template: |
  # Cortex Daily Briefing

  **Current Date:** {date}

  ## Portfolio Pulse
  {portfolio_pulse}

  ## Active Goals
  {active_goals}

  ## Recent Activity (Last 24h)
  {recent_activity}

  ## Priority Actions
  Generate priority recommendations based on:
  - Current blockers and bottlenecks
  - Goal deadlines and dependencies
  - Patterns in recent activity
  - Resource availability

  ## Patterns Noticed
  Analyze activity trends and surface:
  - Project momentum changes
  - Emerging bottlenecks
  - Opportunities for quick wins

  ## Waiting On
  Identify items requiring decisions or actions:
  - Blocked goals
  - Missing configurations
  - Pending reviews

  Format the briefing as clear, actionable markdown with specific next steps.
variables:
  - date
  - portfolio_pulse
  - active_goals
  - recent_activity
metadata:
  author: "cortex-team"
  created: "2026-02-01"
  usage_count: 0
  avg_quality_score: null
  purpose: "Daily briefing generation with context optimization"
  model: "claude-3-5-sonnet-20241022"
  # Context optimization settings
  context_strategy: "category"  # Order by category: instruction → example → data
  optimize_context: true
  max_context_tokens: 2000
  variable_importance:
    # Higher importance = prioritized in attention
    date: 0.9  # Critical temporal context
    active_goals: 0.8  # High-value current state
    portfolio_pulse: 0.7  # Important overview
    recent_activity: 0.6  # Supporting detail
  variable_categories:
    # Category determines positioning
    date: "data"
    active_goals: "data"
    portfolio_pulse: "data"
    recent_activity: "data"
