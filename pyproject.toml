[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-intelligence"
version = "1.2.0b1"
description = "Persistent cross-session intelligence layer for LLM agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Jesse Kemp"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.40.0",
    "rich>=13.0.0",
    "pydantic>=2.5.0",
    "requests>=2.31.0",
    "PyYAML>=6.0.1",
    "structlog>=23.2.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "pytz>=2024.1",
    "numpy>=1.24.0",
    # Hard deps of core modules. intelligence/embeddings_client.py imports
    # sklearn at module top (no try/except), and scipy is required by the
    # synthetic/ test suite. Listed here, not in extras, so a default install
    # produces an importable package.
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "apscheduler>=3.10.0",
    "slowapi>=0.1.9",
    "fastmcp>=3.0.0,<4.0.0",  # provides FastMCP + pins a compatible mcp itself (lifts old mcp<2 cap)
]
analytics = [
    "xgboost>=2.0.0",
    "shap>=0.44.0",
]
orchestration = [
    "litellm>=1.0",
    "httpx>=0.25.0",
]
all = [
    "cortex-intelligence[server,analytics,orchestration]",
]
dev = [
    "pytest>=7.0",
    # pytest-asyncio is required to collect async tests in conductor/tests/,
    # intelligence/tests/, and tests/ — without it 48 async tests show as
    # "Unknown pytest.mark.asyncio" warnings and fail to run.
    "pytest-asyncio>=0.21",
    # Pin below 0.16: the release-touched-paths lint gate (see ci.yml) was
    # written against ruff's E/F/W defaults. Ruff 0.16 promoted UP/BLE/DTZ
    # into its default ruleset, which flags ~60 pre-existing patterns in the
    # gated files (intentional best-effort except-guards, naive datetimes)
    # that are part of the separately-tracked backlog, not this change. Pin so
    # the gate stays honest and green; bump deliberately alongside a backlog
    # cleanup + a widening of the gate's rule selection.
    "ruff>=0.1,<0.16",
    "mypy>=1.0",
]

[project.scripts]
cortex = "cli:main"
cx = "cli:main"
cortex-mcp = "mcp_server:main"

[project.urls]
Homepage = "https://github.com/jessekemp1/cortex"
Repository = "https://github.com/jessekemp1/cortex"

[tool.setuptools]
# All top-level modules at the repo root. The console scripts (cortex,
# cortex-mcp) and the bridge transitively import ~25 of these; the rest are
# runtime-loaded. Static enumeration of the subset repeatedly shipped a broken
# wheel (mcp_handlers, then state_paths, then config… ModuleNotFoundError one
# import deeper each time), so we package every root module. All 42 are
# import-safe (no top-level side effects), so unused ones are inert.
py-modules = ["agent_factory", "ai_intelligence", "alert_monitor", "bridge", "bridge_intelligence", "bridge_system", "briefing_resilient", "config", "context_intelligence", "data_migration", "deep_assessment", "env_loader", "feedback", "formatter", "goal_commands", "goal_parser", "goal_velocity", "heartbeat", "learning", "learning_config", "mcp_handlers", "mcp_server", "metrics_tracker", "orchestrator", "portfolio_analyzer", "portfolio_memory", "recommendation_engine", "recommendations", "reflection", "scheduler", "security", "self_audit", "session_cache", "session_delta", "session_manager", "session_snapshot", "session_watcher", "setup_ops", "spec_knowledge_base", "state_paths", "task_discovery", "validation", "watches", "weekly_planner"]

[tool.setuptools.packages.find]
exclude = [
    "tests*",
    "docs*",
    "examples*",
    "reports*",
    "analysis*",
    "scripts*",
    "MARKETING*",
    "FUTURE*",
    "STRATEGY*",
    "OPUS*",
    "GPT5*",
    "_dead*",
    "_archive*",
    "mvp*",
    "cortex_mvp*",
    "golden-spec-method*",
    "config-backups*",
    "vision*",
    "site*",
    "dashboard*",
    # NOTE: do NOT exclude "batch*" — the batch/ package is in the runtime import
    # closure (learning.py -> batch), so excluding it breaks the cortex console
    # script with ModuleNotFoundError: No module named 'batch'.
    "automation*",
    "v2*",
    "v21*",
]

[tool.pytest.ini_options]
# Skip integration/network/api-key tests by default so a clean-room install
# (e.g. fresh clone in CI or a Show HN reader's box) runs only hermetic tests.
# Opt back in with: `pytest -m "integration"` or `--run-integration` after
# setting CORTEX_ROOT_DIR + ANTHROPIC_API_KEY etc.
addopts = "--strict-markers -m 'not integration and not requires_network and not requires_anthropic_key'"
markers = [
    "integration: requires running services or monorepo environment",
    "requires_network: hits a real network endpoint",
    "requires_anthropic_key: requires ANTHROPIC_API_KEY in env",
]
