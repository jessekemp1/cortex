[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-intelligence"
version = "1.1.0"
description = "Persistent cross-session intelligence layer for LLM agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Jesse Kemp"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "rich>=13.0.0",
    "requests>=2.31.0",
    "PyYAML>=6.0.1",
    "pytz>=2024.1",
]

# Core runs with stdlib + minimal deps above.
# Heavy deps are optional groups for specific features.

[project.optional-dependencies]
llm = [
    "anthropic>=0.40.0",
]
monitoring = [
    "psutil>=5.9.0",
    "structlog>=23.2.0",
    "python-dotenv>=1.0.0",
]
embeddings = [
    "numpy>=1.24.0",
]
server = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "apscheduler>=3.10.0",
    "slowapi>=0.1.9",
    "mcp>=1.0.0",
]
analytics = [
    "pydantic>=2.5.0",
    "xgboost>=2.0.0",
    "shap>=0.44.0",
    "openai>=1.0.0",
]
orchestration = [
    "litellm>=1.0",
    "httpx>=0.25.0",
]
all = [
    "cortex-intelligence[llm,monitoring,embeddings,server,analytics,orchestration]",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.scripts]
cortex = "cli:main"
cx = "cli:main"
cortex-mcp = "mcp_server:main"

[project.urls]
Homepage = "https://github.com/jessekemp1/cortex"
Repository = "https://github.com/jessekemp1/cortex"

[tool.setuptools]
py-modules = ["cli", "bridge", "orchestrator", "formatter", "briefing", "feedback", "goal_parser", "learning", "mcp_server"]

[tool.setuptools.packages.find]
include = [
    "batch*",
    "intelligence*",
    "conductor*",
    "integration*",
    "supervisor*",
    "runtime*",
    "engines*",
    "storage*",
    "workflows*",
    "synthetic*",
]
exclude = [
    "tests*",
    "docs*",
    "examples*",
    "reports*",
    "analysis*",
    "scripts*",
    "MARKETING*",
    "FUTURE*",
    "STRATEGY*",
    "OPUS*",
    "GPT5*",
    "_dead*",
    "_archive*",
    "mvp*",
    "cortex_mvp*",
    "golden-spec-method*",
    "config-backups*",
    "vision*",
    "site*",
    "dashboard*",
    "automation*",
    "v2*",
    "v21*",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires running services or monorepo environment",
    "slow: tests that take > 1 second",
]

[tool.coverage.run]
source = ["supervisor", "guardian", "intelligence/storage", "workflows"]
omit = ["tests/*", "*/test_*", "*/_dead/*", "*/_archive/*"]

[tool.coverage.report]
show_missing = true
fail_under = 50
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "raise NotImplementedError",
]
