[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "cortex-intelligence"
version = "1.0.0"
description = "Persistent cross-session intelligence layer for LLM agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Jesse Kemp"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.40.0",
    "rich>=13.0.0",
    "pydantic>=2.5.0",
    "requests>=2.31.0",
    "PyYAML>=6.0.1",
    "structlog>=23.2.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "pytz>=2024.1",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "apscheduler>=3.10.0",
    "slowapi>=0.1.9",
]
analytics = [
    "xgboost>=2.0.0",
    "shap>=0.44.0",
    "openai>=1.0.0",
]
all = [
    "cortex-intelligence[server,analytics]",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.scripts]
cortex = "cortex.cli:main"
cx = "cortex.cli:main"

[project.urls]
Homepage = "https://github.com/jessekemp1/cortex"
Repository = "https://github.com/jessekemp1/cortex"

[tool.setuptools.packages.find]
exclude = [
    "tests*",
    "docs*",
    "examples*",
    "reports*",
    "analysis*",
    "scripts*",
    "MARKETING*",
    "FUTURE*",
    "STRATEGY*",
    "OPUS*",
    "GPT5*",
    "_dead*",
    "_archive*",
    "mvp*",
    "cortex_mvp*",
    "golden-spec-method*",
    "config-backups*",
    "vision*",
    "site*",
    "dashboard*",
    "batch*",
    "automation*",
    "v2*",
    "v21*",
]
