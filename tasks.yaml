tasks:
  # Learning tests
  - id: learning-tests
    name: Learning Tests
    command: pytest tests/test_learning.py -v
    working_dir: .
    schedule: "1 3 * * *"  # 3:01 AM daily
    type: test
    
  # Briefing tests
  - id: briefing-tests
    name: Briefing Tests
    command: pytest tests/test_briefing.py -v
    working_dir: .
    schedule: "1 3 * * *"  # 3:01 AM daily
    type: test
    
  # Generate morning briefing
  - id: morning-briefing
    name: Generate Morning Briefing
    command: python cli.py briefing
    working_dir: .
    schedule: "1 3 * * *"  # 3:01 AM daily
    type: validation
    output_file: "logs/briefing_$(date +%Y%m%d).txt"
    
  # Week 1 Automation
  - id: week1-automation
    name: Week 1 Automation
    command: python week1_automation.py --daily
    working_dir: .
    schedule: "0 7 * * *"  # 7:00 AM daily
    type: validation

